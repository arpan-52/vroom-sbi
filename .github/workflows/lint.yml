name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          pixi-version: v0.67.2
          environments: dev
          cache: true

      - name: Ruff check
        run: pixi run -e dev lint
