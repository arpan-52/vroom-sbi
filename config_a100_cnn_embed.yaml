# =============================================================================
# VROOM-SBI Configuration File — CNN embedding pilot (faraday_thin only), A100
# =============================================================================
# Copy of config_a100.yaml with sbi.embedding_type: cnn. Scope: retrain
# faraday_thin_n1 only, to compare TARP calibration against the shipped MLP
# posterior before deciding whether to roll out further. Saves to a separate
# directory so it can never touch the shipped models/. See
# config_3080_cnn_embed.yaml for the memory-scoped local-GPU variant.

freq_file: "freq_bands/freq_vla_l.txt"

priors:
  rm:
    min: -500.0
    max: 500.0
  amp:
    min: 0.01
    max: 1.0
  chi0:
    min: 0.0
    max: 3.14159265
  sigma_phi:
    min: 0.0
    max: 200.0
  delta_phi:
    min: 0.0
    max: 200.0

noise:
  mode: "additive"
  sigma_min: 0.001
  sigma_max: 0.05
  augmentation:
    enable: true
    min_factor: 0.5
    max_factor: 2.0

training:
  n_simulations: 30000
  simulation_scaling: true
  simulation_scaling_mode: "power"
  scaling_power: 2.5

  mode: "online"
  sampling_method: "uniform"
  steps_per_epoch: 500
  val_size: 50000

  tf32: true
  amp: "none"

  simulation_batch_size: 30000

  training_batch_size: 65536
  learning_rate: 0.0002
  validation_fraction: 0.1
  stop_after_epochs: 20

  device: "cuda"

  train_pol: true
  train_spectra: false     # pilot: posterior only, no need to retrain spectral model

  save_dir: "models_pilot_cnn"

model_selection:
  min_components: 1
  max_components: 5
  use_classifier: false    # pilot: single posterior only, classifier untouched
  classifier_only: false

physics:
  model_types:
    - "faraday_thin"

weight_augmentation:
  enable: true
  scattered_prob: 0.3
  gap_prob: 0.3
  large_block_prob: 0.1
  noise_variation: true
  continuous_weights: true
  w_min: 0.001

classifier:
  conv_channels: [32, 64, 128]
  kernel_sizes: [7, 5, 3]
  dropout: 0.1
  n_epochs: 50
  batch_size: 1024
  learning_rate: 0.0001
  validation_fraction: 0.2
  use_posterior_simulations: true

sbi:
  model: "nsf"
  num_bins: 16
  embedding_dim: 64
  embedding_type: "cnn"      # pilot change under test
  embedding_conv_channels: [32, 64, 128]
  embedding_kernel_sizes: [7, 5, 3]

  architecture_scaling:
    1:
      hidden_features: 256
      num_transforms: 15
    2:
      hidden_features: 256
      num_transforms: 15
    3:
      hidden_features: 256
      num_transforms: 15
    4:
      hidden_features: 256
      num_transforms: 15
    5:
      hidden_features: 256
      num_transforms: 15
