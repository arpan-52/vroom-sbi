# pyproject.toml — vroom-sbi
# Replaces setup.py.  Manages both the Python package metadata (PEP 621)
# and the pixi environments used for development and CI.

# ---------------------------------------------------------------------------
# Python package metadata (PEP 621)
# ---------------------------------------------------------------------------

[project]
name = "vroom-sbi"
version = "2.0.0"
description = "Simulation-Based Inference for RM Synthesis"
requires-python = ">=3.10"

# Core runtime dependencies (pip-compatible list for non-pixi installs)
dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
    "sbi>=0.18",
    "astropy>=5.0",
    "matplotlib>=3.5",
    "corner>=2.2",
    "tqdm>=4.60",
    "pyyaml>=6.0",
    "huggingface-hub>=0.10",
]

[project.optional-dependencies]
io        = ["spectral-cube>=0.4"]
dev       = ["pytest>=7.0", "pytest-cov"]
notebooks = ["jupyterlab>=4.0", "ipykernel>=6.0", "spectral-cube>=0.4"]

[project.scripts]
vroom-sbi = "src.cli.main:main"

# ---------------------------------------------------------------------------
# Build backend  (setuptools, same behaviour as the old setup.py)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Ruff — linting + formatting config
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # pycodestyle, pyflakes, isort, pyupgrade
ignore = ["E501"]                 # line length handled by formatter

[build-system]
requires      = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]       # finds the top-level 'src' package


# ===========================================================================
# pixi — environment management
# ===========================================================================

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# ---------------------------------------------------------------------------
# Core conda dependencies (default environment)
# ---------------------------------------------------------------------------

[tool.pixi.dependencies]
python          = ">=3.10,<3.13"
numpy           = ">=1.20"
pytorch         = ">=2.0"       # installs the 'torch' Python package
astropy         = ">=5.0"
matplotlib      = ">=3.5"
tqdm            = ">=4.60"
pyyaml          = ">=6.0"
corner          = ">=2.2"
huggingface_hub = ">=0.10"

# PyPI-only packages installed alongside conda deps
# sbi is pulled in transitively via the editable vroom-sbi install
[tool.pixi.pypi-dependencies]
vroom-sbi = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# Feature: io  (spectral_cube for FITS cube I/O)
# ---------------------------------------------------------------------------

[tool.pixi.feature.io.dependencies]
spectral-cube = ">=0.4"

# ---------------------------------------------------------------------------
# Feature: dev  (testing tools)
# ---------------------------------------------------------------------------

[tool.pixi.feature.dev.dependencies]
pytest      = ">=7.0"
pytest-cov  = "*"
ruff        = ">=0.9"
pre-commit  = ">=3.0"

# ---------------------------------------------------------------------------
# Feature: gpu  (CUDA PyTorch build for GPU training / on-the-fly simulation)
# Scoped to a feature so the cross-platform default solve (incl. osx/win and
# CI) stays CPU and portable. pytorch-gpu forces the conda-forge CUDA build.
# ---------------------------------------------------------------------------

[tool.pixi.feature.gpu]
platforms = ["linux-64"]

[tool.pixi.feature.gpu.system-requirements]
cuda = "12"

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = ">=2.0"

# GPU launch tasks (run with: pixi run -e gpu <task>  /  pixi run -e gpu-dev <task>)
[tool.pixi.feature.gpu.tasks]
# Full A100 online training (mode/band/batch/amp set in config_a100.yaml)
train-a100 = "vroom-sbi train --config config_a100.yaml --device cuda"
# Generate the band frequency grids into freq_bands/
gen-bands = "python -c 'from pathlib import Path; from src.utils.freq_bands import write_all_bands; print(*[p.name for p in write_all_bands(Path(\"freq_bands\"))], sep=chr(10))'"
# Short throughput/profiler run (override band/batch via flags)
profile-gpu = "python -m src.utils.profiling --config config_a100.yaml --steps 50 --warmup 10"

# ---------------------------------------------------------------------------
# Feature: notebooks  (JupyterLab + kernel + FITS I/O)
# ---------------------------------------------------------------------------

[tool.pixi.feature.notebooks.dependencies]
jupyterlab    = ">=4.0"
ipykernel     = ">=6.0"
spectral-cube = ">=0.4"
nbconvert     = ">=7.0"
nbclient      = ">=0.9"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------

[tool.pixi.environments]
# Core only — train, infer, validate
default   = { solve-group = "default" }

# Core + FITS I/O
io        = { features = ["io"],                    solve-group = "io"        }

# Core + testing
dev       = { features = ["dev"],                   solve-group = "dev"       }

# Core + FITS I/O + testing  (used in CI)
cube-dev  = { features = ["io", "dev"],             solve-group = "cube-dev"  }

# Core + FITS I/O + JupyterLab  (for notebooks/)
notebooks = { features = ["notebooks"],             solve-group = "notebooks" }

# GPU (CUDA) training environments — linux-64 only
gpu       = { features = ["gpu"],                   solve-group = "gpu"       }
gpu-dev   = { features = ["gpu", "dev"],            solve-group = "gpu"       }

# ---------------------------------------------------------------------------
# Tasks (run with: pixi run <task>  or  pixi run -e <env> <task>)
# ---------------------------------------------------------------------------

[tool.pixi.tasks]
train      = "vroom-sbi train"
validate   = "vroom-sbi validate"

# Tests
test       = "pytest tests/ -v --tb=short"
test-cube  = "pytest tests/test_cube_io.py tests/test_cube_inference.py -v --tb=short"
test-all   = "pytest tests/ -v --tb=short --cov=src --cov-report=term-missing"

# Linting (run manually or via pre-commit)
lint       = "ruff check src tests"
lint-fix   = "ruff check --fix src tests && ruff format src tests"
hooks-install = "pre-commit install"

# Notebooks
notebook         = "jupyter lab notebooks/"
execute-notebook = "jupyter nbconvert --to notebook --execute --inplace notebooks/quickstart_fits_cube.ipynb"
